name: Ollama Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Ollama + Cloudflare Tunnel
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # --------------------------------------------------------
      # 1. CHECKOUT
      # --------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 2. INSTALL DEPENDENCIES
      # --------------------------------------------------------
      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y zstd curl jq
          echo "[+] Dependencies installed."

      # --------------------------------------------------------
      # 3. INSTALL OLLAMA
      # --------------------------------------------------------
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | bash
          ollama --version && echo "[+] Ollama installed successfully."

      # --------------------------------------------------------
      # 4. DETECT HARDWARE RESOURCES
      # --------------------------------------------------------
      - name: Detect Hardware Resources
        id: hardware
        run: |
          TOTAL_RAM_KB=$(grep MemTotal     /proc/meminfo | awk '{print $2}')
          AVAIL_RAM_KB=$(grep MemAvailable /proc/meminfo | awk '{print $2}')
          TOTAL_RAM_GB=$((TOTAL_RAM_KB / 1024 / 1024))
          AVAIL_RAM_GB=$((AVAIL_RAM_KB / 1024 / 1024))
          CPU_CORES=$(nproc)
          CPU_MODEL=$(grep "model name" /proc/cpuinfo | head -1 | cut -d: -f2 | xargs)
          CPU_SHORT=$(printf "%.40s" "$CPU_MODEL")

          # Ensure at least 1GB is reported (safety)
          [ "$AVAIL_RAM_GB" -lt 1 ] && AVAIL_RAM_GB=1

          echo "total_ram=$TOTAL_RAM_GB" >> $GITHUB_OUTPUT
          echo "avail_ram=$AVAIL_RAM_GB" >> $GITHUB_OUTPUT
          echo "cpu_cores=$CPU_CORES"    >> $GITHUB_OUTPUT

          echo ""
          echo "============================================="
          echo " SYSTEM RESOURCES"
          echo "============================================="
          echo " CPU       : $CPU_SHORT"
          echo " Cores     : $CPU_CORES"
          echo " Total RAM : ${TOTAL_RAM_GB}GB"
          echo " Avail RAM : ${AVAIL_RAM_GB}GB"
          echo " Runner    : $(whoami)"
          echo " Home      : $HOME"
          echo "============================================="

      # --------------------------------------------------------
      # 5. SELECT BEST MODEL QUANTIZATION
      # --------------------------------------------------------
      - name: Select Model Quantization
        id: model
        run: |
          MODEL_BASE="orcarouter/Qwen3.8-27B-Uncensored"
          AVAIL_RAM_GB=${{ steps.hardware.outputs.avail_ram }}
          SAFE_LIMIT=$((AVAIL_RAM_GB - 6))

          # Ensure safe limit is not negative
          [ "$SAFE_LIMIT" -lt 1 ] && SAFE_LIMIT=1

          declare -a MODEL_TAGS=(
            "q8_0:29:Highest quality 8-bit"
            "q6_K:22:High quality 6-bit"
            "q5_K_M:19:Good quality 5-bit medium"
            "q5_K_S:18:Good quality 5-bit small"
            "q4_K_M:17:Balanced 4-bit medium"
            "q4_K_S:16:Balanced 4-bit small"
            "iq4_xs:15:Efficient 4-bit XS"
            "q3_K_M:13:Low 3-bit medium"
            "iq3_xxs:11:Low 3-bit XXS"
            "q2_K:11:Lowest 2-bit"
            "iq2_xxs:9:Minimum 2-bit XXS"
          )

          SELECTED_TAG=""
          SELECTED_SIZE=0
          SELECTED_DESC=""

          echo ""
          echo "============================================="
          echo " MODEL SELECTION (Safe limit: ${SAFE_LIMIT}GB)"
          echo "============================================="

          for entry in "${MODEL_TAGS[@]}"; do
            IFS=':' read -r tag size desc <<< "$entry"
            if [ -z "$SELECTED_TAG" ] && [ "$size" -le "$SAFE_LIMIT" ]; then
              SELECTED_TAG="$tag"
              SELECTED_SIZE="$size"
              SELECTED_DESC="$desc"
              printf " [SELECTED] %-12s %4sGB  %s\n" "$tag" "$size" "$desc"
            elif [ "$size" -gt "$SAFE_LIMIT" ]; then
              printf " [TOO BIG]  %-12s %4sGB  %s\n" "$tag" "$size" "$desc"
            else
              printf " [SKIP]     %-12s %4sGB  %s\n" "$tag" "$size" "$desc"
            fi
          done

          # Always fallback to smallest if nothing fits
          if [ -z "$SELECTED_TAG" ]; then
            SELECTED_TAG="iq2_xxs"
            SELECTED_SIZE=9
            SELECTED_DESC="Minimum 2-bit XXS fallback"
            printf " [FALLBACK] %-12s %4sGB  %s\n" \
              "$SELECTED_TAG" "$SELECTED_SIZE" "$SELECTED_DESC"
          fi

          SELECTED_MODEL="${MODEL_BASE}:${SELECTED_TAG}"

          echo "selected_model=$SELECTED_MODEL" >> $GITHUB_OUTPUT
          echo "selected_tag=$SELECTED_TAG"     >> $GITHUB_OUTPUT
          echo "selected_size=$SELECTED_SIZE"   >> $GITHUB_OUTPUT

          echo ""
          echo " Final : $SELECTED_MODEL (${SELECTED_SIZE}GB)"
          echo "============================================="

      # --------------------------------------------------------
      # 6. CONFIGURE & START OLLAMA SERVER
      # --------------------------------------------------------
      - name: Start Ollama Server
        run: |
          AVAIL_RAM_GB=${{ steps.hardware.outputs.avail_ram }}
          CPU_CORES=${{ steps.hardware.outputs.cpu_cores }}

          # Context length calculation
          CTX=$((AVAIL_RAM_GB * 100))
          [ "$CTX" -gt 4096 ] && CTX=4096
          [ "$CTX" -lt 512  ] && CTX=512

          # Use $HOME — runners do not have access to /root
          OLLAMA_MODELS_DIR="$HOME/.ollama/models"
          OLLAMA_LOGS_DIR="$HOME/ollama-logs"

          mkdir -p "$OLLAMA_MODELS_DIR"
          mkdir -p "$OLLAMA_LOGS_DIR"

          echo "[+] Directories:"
          echo "    Models : $OLLAMA_MODELS_DIR"
          echo "    Logs   : $OLLAMA_LOGS_DIR"

          # Save CTX and paths for subsequent steps
          echo "$CTX"               > /tmp/ollama_ctx
          echo "$OLLAMA_LOGS_DIR"   > /tmp/ollama_logs_dir
          echo "$OLLAMA_MODELS_DIR" > /tmp/ollama_models_dir

          # Set all environment variables
          export OLLAMA_MODELS="$OLLAMA_MODELS_DIR"
          export OLLAMA_HOST="0.0.0.0:11434"
          export OLLAMA_LLM_LIBRARY="cpu"
          export OLLAMA_NUM_PARALLEL=1
          export OLLAMA_MAX_LOADED_MODELS=1
          export OLLAMA_NUM_THREADS=$CPU_CORES
          export OLLAMA_KEEP_ALIVE="24h"
          export OLLAMA_CONTEXT_LENGTH=$CTX
          export OLLAMA_KV_CACHE_TYPE="q8_0"
          export OLLAMA_FLASH_ATTENTION=false

          # Start Ollama server
          nohup ollama serve > "$OLLAMA_LOGS_DIR/server.log" 2>&1 &
          echo "[+] Ollama server started. PID: $!"

          # Wait for API to be ready (up to 30s)
          echo "[*] Waiting for Ollama API..."
          API_READY=false
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:11434/api/tags > /dev/null 2>&1; then
              echo "[+] API ready after ${i}s"
              API_READY=true
              break
            fi
            sleep 1
          done

          if [ "$API_READY" = "false" ]; then
            echo "[-] Ollama API failed to start. Server log:"
            cat "$OLLAMA_LOGS_DIR/server.log"
            exit 1
          fi

          # RAM detection check
          echo ""
          echo "[*] RAM detection:"
          grep "inference compute" "$OLLAMA_LOGS_DIR/server.log" || \
            echo "[!] inference compute line not found yet (non-critical)"

          if grep -q "953.7 MiB" "$OLLAMA_LOGS_DIR/server.log" 2>/dev/null; then
            echo "[-] WARNING: tmpfs RAM limit detected."
          else
            echo "[+] RAM detection looks correct."
          fi

          echo ""
          echo " Context Length : $CTX tokens"
          echo " CPU Threads    : $CPU_CORES"
          echo " Model Storage  : $OLLAMA_MODELS_DIR"

      # --------------------------------------------------------
      # 7. PULL MODEL
      # --------------------------------------------------------
      - name: Pull Model
        run: |
          SELECTED_MODEL="${{ steps.model.outputs.selected_model }}"
          OLLAMA_LOGS_DIR=$(cat /tmp/ollama_logs_dir)
          OLLAMA_MODELS_DIR=$(cat /tmp/ollama_models_dir)

          export OLLAMA_MODELS="$OLLAMA_MODELS_DIR"
          export OLLAMA_HOST="0.0.0.0:11434"

          echo "[*] Pulling: $SELECTED_MODEL"
          echo "[*] This may take several minutes..."

          ollama pull "$SELECTED_MODEL" 2>&1 | tee "$OLLAMA_LOGS_DIR/pull.log"

          echo "[+] Pull complete."

      # --------------------------------------------------------
      # 8. WARMUP - Force Model Into RAM
      # --------------------------------------------------------
      - name: Warmup Model
        run: |
          SELECTED_MODEL="${{ steps.model.outputs.selected_model }}"
          CPU_CORES=${{ steps.hardware.outputs.cpu_cores }}
          CTX=$(cat /tmp/ollama_ctx)
          OLLAMA_LOGS_DIR=$(cat /tmp/ollama_logs_dir)

          echo "[*] Warming up: $SELECTED_MODEL"
          echo "[*] Forcing model load into RAM with keep_alive 24h..."

          HTTP_CODE=$(curl -s -o "$OLLAMA_LOGS_DIR/warmup.log" \
            -w "%{http_code}" \
            --max-time 600 \
            http://127.0.0.1:11434/api/generate \
            -H "Content-Type: application/json" \
            -d "{
              \"model\": \"$SELECTED_MODEL\",
              \"prompt\": \"Hi\",
              \"stream\": false,
              \"keep_alive\": \"24h\",
              \"options\": {
                \"num_ctx\": $CTX,
                \"num_thread\": $CPU_CORES
              }
            }")

          echo "[+] Warmup HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "[-] Warmup failed with HTTP $HTTP_CODE"
            cat "$OLLAMA_LOGS_DIR/warmup.log"
            echo "--- Server Log (last 20 lines) ---"
            tail -20 "$OLLAMA_LOGS_DIR/server.log"
            exit 1
          fi

          echo "[+] Warmup response:"
          cat "$OLLAMA_LOGS_DIR/warmup.log" \
            | jq '{response, done, load_duration, eval_duration}' 2>/dev/null \
            || cat "$OLLAMA_LOGS_DIR/warmup.log"

      # --------------------------------------------------------
      # 9. CLOUDFLARE TUNNEL
      # --------------------------------------------------------
      - name: Start Cloudflare Tunnel
        run: |
          CF_TOKEN="eyJhIjoiMzk0M2Q0ZWMxOGM1MzkxZmJiZTkxNThhNWQ2MjliNTUiLCJ0IjoiYzEwMTlkNmUtODI4ZC00YTk3LTliNzQtMmQ3NzEyODM1Y2FhIiwicyI6IlpEbGlZek16T1RRdFkyVmtPUzAwTW1ObUxUa3paV0l0TkRZMVpEUTRNVFk1Wm1FMyJ9"
          OLLAMA_LOGS_DIR=$(cat /tmp/ollama_logs_dir)

          # Install cloudflared if missing
          if ! command -v cloudflared > /dev/null 2>&1; then
            echo "[*] Installing cloudflared..."
            curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg \
              | sudo tee /usr/share/keyrings/cloudflare-main.gpg > /dev/null
            echo 'deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared noble main' \
              | sudo tee /etc/apt/sources.list.d/cloudflared.list
            sudo apt-get update -y > /dev/null 2>&1
            sudo apt-get install -y cloudflared > /dev/null 2>&1
            echo "[+] cloudflared installed: $(cloudflared --version)"
          else
            echo "[+] cloudflared already present: $(cloudflared --version)"
          fi

          # Remove any existing service cleanly
          sudo cloudflared service uninstall 2>/dev/null || true
          sudo pkill -f "cloudflared" 2>/dev/null || true
          sleep 2

          # Install as system service using token
          echo "[*] Installing Cloudflare tunnel as system service..."
          sudo cloudflared service install "$CF_TOKEN"

          # Wait for service to become active (up to 30s)
          echo "[*] Waiting for cloudflared service to start..."
          SERVICE_UP=false
          for i in $(seq 1 15); do
            if sudo systemctl is-active --quiet cloudflared 2>/dev/null; then
              echo "[+] cloudflared service active after $((i * 2))s"
              SERVICE_UP=true
              break
            fi
            sleep 2
          done

          if [ "$SERVICE_UP" = "false" ]; then
            echo "[-] cloudflared service did not start. Checking status..."
            sudo systemctl status cloudflared --no-pager || true
            sudo journalctl -u cloudflared -n 50 --no-pager || true
            exit 1
          fi

          echo ""
          echo "--- Service Status ---"
          sudo systemctl status cloudflared --no-pager || true

          echo ""
          echo "--- Tunnel Logs ---"
          sudo journalctl -u cloudflared -n 30 --no-pager || true

      # --------------------------------------------------------
      # 10. TEST PROMPT - Verify Model & Resources Ready
      # --------------------------------------------------------
      - name: Test Prompt and Verify Model Load
        run: |
          SELECTED_MODEL="${{ steps.model.outputs.selected_model }}"
          CPU_CORES=${{ steps.hardware.outputs.cpu_cores }}
          AVAIL_RAM_GB=${{ steps.hardware.outputs.avail_ram }}
          CTX=$(cat /tmp/ollama_ctx)
          OLLAMA_LOGS_DIR=$(cat /tmp/ollama_logs_dir)

          echo "============================================="
          echo " TEST PROMPT"
          echo " Model  : $SELECTED_MODEL"
          echo " Context: $CTX tokens"
          echo " Cores  : $CPU_CORES"
          echo "============================================="

          # Wait for model to appear in /api/ps (up to 10 min)
          echo "[*] Waiting for model to be ready in memory..."
          READY=false
          for i in $(seq 1 60); do
            API_PS=$(curl -s http://127.0.0.1:11434/api/ps 2>/dev/null || true)
            LOADED=$(echo "$API_PS" | jq -r '.models[0].name // empty' 2>/dev/null || true)
            if [ -n "$LOADED" ]; then
              echo "[+] Model confirmed in memory: $LOADED"
              READY=true
              break
            fi
            printf "    [%02d/60] Not yet loaded, waiting 10s...\n" "$i"
            sleep 10
          done

          if [ "$READY" = "false" ]; then
            echo "[!] Model not in /api/ps after 10min. Attempting cold test anyway..."
          fi

          # Send test prompt
          echo ""
          echo "[*] Sending test prompt..."
          START_TIME=$(date +%s)

          RESPONSE=$(curl -s --max-time 300 \
            http://127.0.0.1:11434/api/generate \
            -H "Content-Type: application/json" \
            -d "{
              \"model\": \"$SELECTED_MODEL\",
              \"prompt\": \"In one sentence, what is 2+2 and why?\",
              \"stream\": false,
              \"keep_alive\": \"24h\",
              \"options\": {
                \"num_ctx\": $CTX,
                \"num_thread\": $CPU_CORES,
                \"temperature\": 0.1
              }
            }" 2>/dev/null || true)

          END_TIME=$(date +%s)
          ELAPSED=$((END_TIME - START_TIME))

          echo ""
          echo "============================================="
          echo " TEST RESULTS"
          echo "============================================="

          # Check empty response
          if [ -z "$RESPONSE" ]; then
            echo "[-] FAIL: Empty response from API"
            echo "--- Server Log (last 30 lines) ---"
            tail -30 "$OLLAMA_LOGS_DIR/server.log"
            exit 1
          fi

          # Check for API error in response body
          ERROR=$(echo "$RESPONSE" | jq -r '.error // empty' 2>/dev/null || true)
          if [ -n "$ERROR" ]; then
            echo "[-] FAIL: API error: $ERROR"
            echo "--- Server Log (last 30 lines) ---"
            tail -30 "$OLLAMA_LOGS_DIR/server.log"
            exit 1
          fi

          # Parse metrics
          REPLY=$(echo         "$RESPONSE" | jq -r '.response          // "N/A"' 2>/dev/null || echo "N/A")
          PROMPT_EVAL=$(echo   "$RESPONSE" | jq -r '.prompt_eval_count // "?"'   2>/dev/null || echo "?")
          EVAL_COUNT=$(echo    "$RESPONSE" | jq -r '.eval_count        // 0'     2>/dev/null || echo "0")
          EVAL_DURATION=$(echo "$RESPONSE" | jq -r '.eval_duration     // 0'     2>/dev/null || echo "0")
          LOAD_DURATION=$(echo "$RESPONSE" | jq -r '.load_duration     // 0'     2>/dev/null || echo "0")

          LOAD_SEC=$(echo "$LOAD_DURATION" | awk '{printf "%.2f", $1/1000000000}')
          EVAL_SEC=$(echo "$EVAL_DURATION" | awk '{printf "%.2f", $1/1000000000}')
          TPS=$(echo "$EVAL_COUNT $EVAL_DURATION" | awk '{
            if ($2 > 0) printf "%.2f", $1/($2/1000000000)
            else print "N/A"
          }')

          echo " Status       : PASS"
          echo " Response     : $REPLY"
          echo "---------------------------------------------"
          echo " Load Time    : ${LOAD_SEC}s"
          echo " Eval Time    : ${EVAL_SEC}s"
          echo " Total Time   : ${ELAPSED}s"
          echo " Tokens In    : $PROMPT_EVAL"
          echo " Tokens Out   : $EVAL_COUNT"
          echo " Tokens/sec   : $TPS tok/s"
          echo "============================================="

          # Verify model pinned in memory
          echo ""
          echo "[*] Verifying model pinned in memory..."
          PS_OUT=$(curl -s http://127.0.0.1:11434/api/ps 2>/dev/null || true)
          PIN_NAME=$(echo    "$PS_OUT" | jq -r '.models[0].name       // empty'     2>/dev/null || true)
          PIN_SIZE=$(echo    "$PS_OUT" | jq -r '.models[0].size       // 0'         2>/dev/null || echo "0")
          PIN_EXP=$(echo     "$PS_OUT" | jq -r '.models[0].expires_at // "unknown"' 2>/dev/null || true)
          PIN_GB=$(echo "$PIN_SIZE" | awk '{printf "%.2f", $1/1024/1024/1024}')

          if [ -n "$PIN_NAME" ]; then
            echo "[+] Model pinned:"
            echo "    Name    : $PIN_NAME"
            echo "    RAM     : ${PIN_GB}GB"
            echo "    Expires : $PIN_EXP"
          else
            echo "[!] Model not showing in /api/ps (may reload on next request)"
          fi

          # Post-load RAM report
          echo ""
          MEM_FREE_KB=$(grep MemAvailable /proc/meminfo | awk '{print $2}')
          MEM_FREE_GB=$((MEM_FREE_KB / 1024 / 1024))
          MEM_USED_GB=$((AVAIL_RAM_GB - MEM_FREE_GB))
          echo "[*] RAM Report:"
          echo "    Before Load : ${AVAIL_RAM_GB}GB free"
          echo "    After Load  : ${MEM_FREE_GB}GB free"
          echo "    Consumed    : ~${MEM_USED_GB}GB"
          echo ""
          echo "[+] All checks passed. Model is ready for inference."

      # --------------------------------------------------------
      # 11. HOLD UNTIL TIMEOUT
      # --------------------------------------------------------
      - name: Hold Session Until Timeout
        run: |
          SELECTED_MODEL="${{ steps.model.outputs.selected_model }}"
          SELECTED_SIZE="${{ steps.model.outputs.selected_size }}"
          AVAIL_RAM_GB=${{ steps.hardware.outputs.avail_ram }}
          CPU_CORES=${{ steps.hardware.outputs.cpu_cores }}
          CTX=$(cat /tmp/ollama_ctx)
          OLLAMA_LOGS_DIR=$(cat /tmp/ollama_logs_dir)
          OLLAMA_MODELS_DIR=$(cat /tmp/ollama_models_dir)
          CF_TOKEN="eyJhIjoiMzk0M2Q0ZWMxOGM1MzkxZmJiZTkxNThhNWQ2MjliNTUiLCJ0IjoiYzEwMTlkNmUtODI4ZC00YTk3LTliNzQtMmQ3NzEyODM1Y2FhIiwicyI6IlpEbGlZek16T1RRdFkyVmtPUzAwTW1ObUxUa3paV0l0TkRZMVpEUTRNVFk1Wm1FMyJ9"

          echo ""
          echo "============================================="
          echo "         DEPLOYMENT COMPLETE"
          echo "============================================="
          echo " Model    : $SELECTED_MODEL"
          echo " Size     : ${SELECTED_SIZE}GB"
          echo " RAM Free : ${AVAIL_RAM_GB}GB"
          echo " Cores    : ${CPU_CORES}"
          echo " Context  : ${CTX} tokens"
          echo " API      : http://0.0.0.0:11434"
          echo " Tunnel   : Cloudflare Service"
          echo " Runner   : $(whoami) @ $HOME"
          echo "============================================="
          echo ""
          echo "[*] Holding for up to 350 minutes..."
          echo "[*] Heartbeat every 60s. Auto-restart on crash."
          echo ""

          ELAPSED=0
          MAX_MINUTES=350

          while [ $ELAPSED -lt $MAX_MINUTES ]; do
            sleep 60
            ELAPSED=$((ELAPSED + 1))

            # Health checks
            API_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              http://127.0.0.1:11434/api/tags 2>/dev/null || echo "000")
            OLLAMA_PID=$(pgrep -f "ollama serve" | head -1 || echo "dead")
            CF_STATUS=$(sudo systemctl is-active cloudflared 2>/dev/null || echo "dead")
            MEM_FREE_KB=$(grep MemAvailable /proc/meminfo | awk '{print $2}')
            MEM_FREE_GB=$((MEM_FREE_KB / 1024 / 1024))
            MODEL_STATUS=$(curl -s http://127.0.0.1:11434/api/ps 2>/dev/null \
              | jq -r '.models[0].name // "unloaded"' 2>/dev/null || echo "unloaded")

            printf "[%03d min] Ollama=%-6s API=%s | CF=%-8s | RAM=%sGB | Model=%s\n" \
              "$ELAPSED" "$OLLAMA_PID" "$API_STATUS" \
              "$CF_STATUS" "$MEM_FREE_GB" "$MODEL_STATUS"

            # Auto-restart Ollama if dead
            if [ "$OLLAMA_PID" = "dead" ]; then
              echo "[!] Ollama died — restarting..."
              export OLLAMA_MODELS="$OLLAMA_MODELS_DIR"
              export OLLAMA_HOST="0.0.0.0:11434"
              export OLLAMA_LLM_LIBRARY="cpu"
              export OLLAMA_NUM_PARALLEL=1
              export OLLAMA_MAX_LOADED_MODELS=1
              export OLLAMA_NUM_THREADS=$CPU_CORES
              export OLLAMA_KEEP_ALIVE="24h"
              export OLLAMA_CONTEXT_LENGTH=$CTX
              export OLLAMA_KV_CACHE_TYPE="q8_0"
              export OLLAMA_FLASH_ATTENTION=false
              nohup ollama serve >> "$OLLAMA_LOGS_DIR/server.log" 2>&1 &
              sleep 5
              NEW_PID=$(pgrep -f "ollama serve" | head -1 || echo "failed")
              echo "[+] Ollama restarted. PID: $NEW_PID"
            fi

            # Auto-reload model if unloaded but API is up
            if [ "$MODEL_STATUS" = "unloaded" ] && [ "$API_STATUS" = "200" ]; then
              echo "[!] Model unloaded — reloading into RAM..."
              curl -s --max-time 600 \
                http://127.0.0.1:11434/api/generate \
                -H "Content-Type: application/json" \
                -d "{
                  \"model\": \"$SELECTED_MODEL\",
                  \"prompt\": \"Hi\",
                  \"stream\": false,
                  \"keep_alive\": \"24h\",
                  \"options\": {
                    \"num_ctx\": $CTX,
                    \"num_thread\": $CPU_CORES
                  }
                }" > /dev/null 2>&1 &
              echo "[+] Model reload triggered."
            fi

            # Auto-restart Cloudflare service if dead
            if [ "$CF_STATUS" != "active" ]; then
              echo "[!] Cloudflared service down — restarting..."
              sudo systemctl restart cloudflared 2>/dev/null || \
              sudo cloudflared service install "$CF_TOKEN" 2>/dev/null || true
              sleep 3
              NEW_CF=$(sudo systemctl is-active cloudflared 2>/dev/null || echo "failed")
              echo "[+] Cloudflared status: $NEW_CF"
            fi

          done

          echo ""
          echo "[*] Max hold time reached (${MAX_MINUTES} min). Workflow ending cleanly."
